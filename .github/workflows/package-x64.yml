name: Package x64

on:
  push:
    branches: [ build/package-x64 ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
    - name: Configure Git for long paths
      run: git config --global core.longpaths true

    - uses: actions/checkout@v6
      with:
        submodules: 'recursive'

    - name: Install packaging tools
      shell: cmd
      run: |
        choco install 7zip innosetup --yes --no-progress
        where 7z
        if exist "%ProgramFiles(x86)%\Inno Setup 6\iscc.exe" (echo Inno6 OK) else (echo Inno6 MISSING)
        if exist "%ProgramFiles(x86)%\Inno Setup 5\iscc.exe" (echo Inno5 OK) else (echo Inno5 MISSING)

    - name: Cache
      uses: actions/cache@v5
      with:
        path: Build/WinMergeDownloadDeps
        key: WinMergeDownloadDeps

    - name: Build
      shell: cmd
      run: |
        call DownloadDeps.cmd
        if errorlevel 1 exit /b 1
        call BuildAll.vs2022.cmd x64 -ci
        if errorlevel 1 exit /b 1
        dir /s Build\Releases
        dir Build\x64\Release\WinMergeU.exe

    - name: Upload zip
      uses: actions/upload-artifact@v4
      with:
        name: WinMerge-x64.zip
        path: Build/Releases/*.zip
        if-no-files-found: error

    - name: Upload installer
      uses: actions/upload-artifact@v4
      with:
        name: WinMerge-x64-Setup.exe
        path: Build/Releases/*.exe
        if-no-files-found: warn
